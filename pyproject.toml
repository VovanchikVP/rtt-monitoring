[project]
name = "rtt-monitoring"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migration/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # длину строк контролирует форматтер
    "RUF001", # кириллица в строках и комментариях — норма для проекта
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migration/env.py" = ["F403", "F405"]  # alembic требует `from src.models import *`
"src/models/__init__.py" = ["F401"]    # реэкспорт моделей для alembic

[tool.ruff.format]
quote-style = "double"
