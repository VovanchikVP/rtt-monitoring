apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // метки, по которым потом фильтруем в Grafana
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // путь к файлу логов контейнера на ноде
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }

      // Поды ищутся по всему кластеру, но файлы есть только для локальных —
      // чужие цели просто не найдутся. Чтобы собирать логи только приложения,
      // раскомментировать:
      // rule {
      //   source_labels = ["__meta_kubernetes_namespace"]
      //   regex         = "rtt"
      //   action        = "keep"
      // }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      // снять обёртку формата CRI: время, поток, флаг многострочности
      stage.cri {}

      // текущий формат приложения: "2026-10-16 07:12:03,123 INFO src.module: текст"
      stage.regex {
        expression = "^\\S+ \\S+ (?P<level>[A-Z]+) (?P<logger>\\S+): "
      }
      // celery перехватывает корневой логгер, и у воркера формат другой:
      // "[2026-10-16 07:12:03,123: INFO/ForkPoolWorker-1] текст".
      // Стадия, которая не совпала, просто ничего не извлекает.
      stage.regex {
        expression = "^\\[\\S+ \\S+: (?P<level>[A-Z]+)/\\S+\\] "
      }

      stage.labels {
        values = {
          level = "level",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
