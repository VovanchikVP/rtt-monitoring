# Монолитный Loki (-target=all) на одной ноде: файловое хранилище,
# кольцо в памяти, один арендатор. Всё, что рассчитано на кластер
# и объектное хранилище, здесь не нужно.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  config.yaml: |
    # без арендаторов: Grafana и Alloy ходят без заголовка X-Scope-OrgID
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          # одна реплика: согласовывать кольцо не с кем, consul/etcd не нужны
          store: inmemory

    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache

    limits_config:
      retention_period: 720h          # 30 дней
      # нужно для панели Logs volume в Grafana
      volume_enabled: true
      # запас на всплески логов воркера
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    # чистку старых чанков делает он же, иначе retention_period ни на что не влияет
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          # кеш внутри процесса вместо отдельного memcached
          embedded_cache:
            enabled: true
            max_size_mb: 100

    ruler:
      storage:
        type: local
        local:
          directory: /var/loki/rules
      rule_path: /var/loki/rules-temp

    # кластер закрытый, наружу ходить незачем
    analytics:
      reporting_enabled: false
