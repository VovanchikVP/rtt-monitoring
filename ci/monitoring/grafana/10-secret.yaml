# Учётные данные администратора Grafana. Значения тестовые — перед выкаткой
# замените, либо создайте секрет отдельно и уберите файл из kustomization:
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=username=admin --from-literal=password='<пароль>'
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  username: admin
  password: admin
