# Провайдер дашбордов: Grafana читает каталог при старте и дальше
# перечитывает его раз в updateIntervalSeconds, так что правка ConfigMap'а
# доезжает без рестарта пода.
#
# allowUiUpdates: false — правки из UI не сохраняются, источник правды git.
# Чтобы поиграться с панелями, дашборд удобно скопировать: Save as.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: rtt
        orgId: 1
        folder: RTT
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 60
        options:
          # сюда примонтирован ConfigMap с JSON-ами дашбордов
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
