apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtt-api
  namespace: rtt
  labels:
    app: rtt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rtt-api
  template:
    metadata:
      labels:
        app: rtt-api
    spec:
      containers:
        - name: api
          image: rtt-monitoring
          args: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            # учётные данные брокера берём из того же секрета, что и сам RabbitMQ,
            # чтобы они не разъезжались между инфраструктурой и приложением
            - name: APP_RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: username
            - name: APP_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
          envFrom:
            - configMapRef:
                name: rtt-config
            - secretRef:
                name: rtt-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rtt-api
  namespace: rtt
  labels:
    app: rtt-api
spec:
  selector:
    app: rtt-api
  ports:
    - name: http
      port: 80
      targetPort: http
