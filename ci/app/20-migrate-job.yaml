# Миграции накатываются перед выкаткой подов приложения.
# Job неизменяем, поэтому пайплайн удаляет его перед повторным применением.
apiVersion: batch/v1
kind: Job
metadata:
  name: rtt-migrate
  namespace: rtt
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: rtt-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: rtt-monitoring
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: rtt-config
            - secretRef:
                name: rtt-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
