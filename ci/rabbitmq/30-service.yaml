apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rtt
  labels:
    app: rabbitmq
spec:
  # headless: StatefulSet получает стабильное DNS-имя rabbitmq-0.rabbitmq.rtt
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
