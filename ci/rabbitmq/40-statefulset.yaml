apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: rtt
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        # uid/gid пользователя rabbitmq в официальном образе —
        # без этого том local-path примонтируется с правами root
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # без этого kubelet при каждом монтировании рекурсивно выставляет
        # группе права на запись, и RabbitMQ отказывается стартовать:
        # "Cookie file /var/lib/rabbitmq/.erlang.cookie must be accessible by owner only"
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/10-celery.conf
              subPath: 10-celery.conf
              readOnly: true
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # в k3s по умолчанию работает local-path provisioner
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
