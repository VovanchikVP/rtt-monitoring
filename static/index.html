<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTT monitoring</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <h1>RTT monitoring</h1>
  <div class="sub">Турниры и рейтинговые очки участников. Клик по строке турнира покажет состав,
    клик по игроку — график его рейтинга</div>

  <div class="card">
    <form class="row" id="add-form">
      <input id="tour-id" inputmode="numeric" placeholder="ID турнира" required>
      <button class="primary" type="submit">Добавить</button>
    </form>
    <div class="msg" id="add-msg"></div>
  </div>

  <div class="card">
    <div class="head">
      <h2>Турниры</h2>
      <span class="status" id="tours-status"></span>
    </div>
    <div class="wide"><table id="tours">
      <thead>
        <tr>
          <th class="num">ID</th><th>Название</th><th>Город</th>
          <th>Даты</th><th class="num">Участников</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table></div>
    <div class="empty" id="tours-empty" hidden>Пока ни одного турнира</div>
    <div class="empty" id="tours-current-empty" hidden>Все турниры уже завершились</div>

    <details class="done" id="tours-done-box" hidden>
      <summary id="tours-done-summary"></summary>
      <div class="wide"><table id="tours-done">
        <thead>
          <tr>
            <th class="num">ID</th><th>Название</th><th>Город</th>
            <th>Даты</th><th class="num">Участников</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table></div>
    </details>
  </div>

  <div class="card" id="players-card" hidden>
    <div class="head">
      <h2 id="players-title">Участники</h2>
      <span class="status" id="players-status"></span>
    </div>
    <div class="wide"><table id="players">
      <thead>
        <tr>
          <th class="num">#</th><th>Игрок</th><th class="num">Возраст</th>
          <th>Город</th><th class="num">Очки</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
