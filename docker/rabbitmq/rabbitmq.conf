# Celery объявляет служебную очередь удалённого управления (pidbox) как
# transient non-exclusive. С RabbitMQ 4.2 такие очереди по умолчанию запрещены,
# и воркер падает на Queue.declare с INTERNAL_ERROR (541).
# Разрешаем явно, пока celery не перейдёт на durable-очереди.
deprecated_features.permit.transient_nonexcl_queues = true
